name: Site check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * *"

jobs:
  checkout-checks:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify legal pages exist in checkout
        run: |
          set -euo pipefail
          for path in terms/index.html privacy/index.html terms.html privacy.html; do
            if [ ! -f "$path" ]; then
              echo "Missing required file: $path"
              exit 1
            fi
            echo "OK: $path"
          done

      - name: Verify root redirects point to directory URLs
        run: |
          set -euo pipefail
          grep -q 'content="0; url=/terms/"' terms.html
          grep -q 'href="/terms/"' terms.html
          grep -q 'content="0; url=/privacy/"' privacy.html
          grep -q 'href="/privacy/"' privacy.html
          echo "Redirect targets OK"

      - name: Check HTML visible text for banned strings
        run: |
          python3 << 'PY'
          import re
          import sys
          from pathlib import Path

          banned = re.compile(
              r"\b(live|profit|guarantee|audit|launched|only|trading|telegram|Dubai|UAE|Emirates|Egypt)\b|t\.me|qq\.com",
              re.I,
          )

          def visible_text(html: str) -> str:
              html = re.sub(r"<!--.*?-->", "", html, flags=re.S)
              html = re.sub(r"<style[^>]*>.*?</style>", "", html, flags=re.S | re.I)
              html = re.sub(r"<script[^>]*>.*?</script>", "", html, flags=re.S | re.I)
              html = re.sub(r"<[^>]+>", " ", html)
              return html

          failed = False
          for path in sorted(Path(".").rglob("*.html")):
              if ".git" in path.parts:
                  continue
              text = visible_text(path.read_text(encoding="utf-8"))
              for match in banned.finditer(text):
                  print(f"{path}: banned match {match.group(0)!r}")
                  failed = True

          sys.exit(1 if failed else 0)
          PY

  deployed-checks:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed URLs return 200
        run: |
          set -euo pipefail
          base="https://chatting.elghaly.dev"
          paths="/ /terms /terms/ /terms.html /privacy /privacy/ /privacy.html"
          ok=false
          for attempt in 1 2 3 4 5 6; do
            failed=0
            for path in $paths; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" -L "${base}${path}")
              echo "${base}${path} -> ${code}"
              if [ "$code" != "200" ]; then
                failed=1
              fi
            done
            if [ "$failed" -eq 0 ]; then
              ok=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Waiting for GitHub Pages deploy (attempt ${attempt}/6)..."
              sleep 30
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "Expected HTTP 200 for all production URLs after redirects"
            exit 1
          fi
